version: '3.8'

services:
  # 1. PostgreSQL Database with GiST Exclusion Constraints
  postgres:
    image: postgres:16-alpine
    container_name: ira-postgres
    restart: always
    environment:
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_secure_password_2026
      POSTGRES_DB: ira_campus_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ira-network

  # 2. Redis Cache & Socket Adapter (Optional accelerator)
  redis:
    image: redis:7-alpine
    container_name: ira-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ira-network

  # 3. Python FastAPI AI/ML Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ira-ai-service
    restart: always
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000
    ports:
      - "8000:8000"
    networks:
      - ira-network

  # 4. Node.js Express Core API Gateway & Allocation Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ira-backend
    restart: always
    depends_on:
      - postgres
      - ai-service
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://campus_admin:campus_secure_password_2026@postgres:5432/ira_campus_db
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=ira-super-secret-jwt-key-2026-campus-allocator
    ports:
      - "5000:5000"
    networks:
      - ira-network

  # 5. React Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ira-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - ira-network

networks:
  ira-network:
    driver: bridge

volumes:
  pgdata:
